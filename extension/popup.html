<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 360px; margin: 0; padding: 12px; font: 12px/1.5 -apple-system, "Segoe UI", sans-serif; background: #1e1e20; color: #f5f5f7; }
    h1 { font-size: 13px; margin: 0 0 8px; }
    label { display: block; margin: 8px 0 3px; opacity: .75; }
    textarea, input { width: 100%; box-sizing: border-box; background: #2a2a2d; color: inherit; border: 1px solid #3a3a3d; border-radius: 6px; padding: 6px; font: inherit; }
    textarea { height: 54px; resize: vertical; }
    button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #d97757; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #status { margin-top: 8px; white-space: pre-wrap; font-size: 11px; opacity: .85; }
    .hint { margin-top: 6px; font-size: 10.5px; opacity: .55; }
  </style>
</head>
<body>
  <h1>ego-browser login bridge</h1>
  <label for="domains">Domains (one per line)</label>
  <textarea id="domains" placeholder="example.com"></textarea>
  <label for="port">Loopback port</label>
  <input id="port" type="number" value="53820" />
  <label for="token">Token (stateDir/login-extension-token)</label>
  <input id="token" type="password" autocomplete="off" />
  <button id="export">Export cookies to ego-browser</button>
  <div id="status"></div>
  <div class="hint">Start ego_login_import with source="extension" first, then click Export. Values are sent to 127.0.0.1 only; nothing is uploaded.</div>
  <script src="popup.js"></script>
</body>
</html>
