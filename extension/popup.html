<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 340px; margin: 0; padding: 14px; font: 12px/1.5 -apple-system, "Segoe UI", sans-serif; background: #1e1e20; color: #f5f5f7; }
    h1 { font-size: 13px; margin: 0 0 4px; }
    .sub { opacity: .55; font-size: 10.5px; margin-bottom: 10px; }
    label { display: block; margin: 8px 0 3px; opacity: .75; }
    input { width: 100%; box-sizing: border-box; background: #2a2a2d; color: inherit; border: 1px solid #3a3a3d; border-radius: 6px; padding: 7px; font: inherit; letter-spacing: 1px; }
    button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #d97757; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #3a3a3d; color: #f5f5f7; font-weight: 400; }
    button:disabled { opacity: .6; cursor: default; }
    #status { margin-top: 9px; white-space: pre-wrap; font-size: 11px; opacity: .85; }
    .hint { margin-top: 8px; font-size: 10.5px; opacity: .5; }
    .ok { color: #8fd18f; }
  </style>
</head>
<body>
  <h1>ego-browser login bridge</h1>
  <div class="sub">Pair once, then import from the Agent Browser panel with one click.</div>
  <label for="port">Loopback port</label>
  <input id="port" inputmode="numeric" value="53820" />
  <label for="code">Pairing code (from the Agent Browser panel)</label>
  <input id="code" inputmode="numeric" maxlength="6" placeholder="6 digits" />
  <button id="pair">Pair with ego-browser</button>
  <button id="disconnect" class="secondary">Disconnect</button>
  <div id="status"></div>
  <div class="hint">Cookie values are sent only to 127.0.0.1 and are never logged. The extension polls the local bridge in the background while Chrome runs.</div>
  <script src="popup.js"></script>
</body>
</html>
